<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d3a">
  <meta name="description" content="A private, shared planner for your trips, tasks, stays and bookings.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trip Planner">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=20260928-8">
  <title>Trip Planner</title>
</head>
<body>
  <div id="app" class="app-loading"><div class="loading-ring"></div><p>Opening your trip planner…</p></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="editor" class="editor-dialog" aria-labelledby="editor-title">
    <form id="editor-form" class="editor-form">
      <div class="editor-header"><div><p class="eyebrow">TRIP PLANNER</p><h2 id="editor-title">Edit</h2></div><button type="button" class="icon-button" id="editor-close" aria-label="Close">✕</button></div>
      <div id="editor-fields" class="editor-fields"></div>
      <p id="editor-error" class="form-error" role="alert" hidden></p>
      <div class="editor-actions"><button type="button" class="button button-danger" id="editor-delete" hidden>Delete</button><button type="button" class="button button-quiet" id="editor-cancel">Cancel</button><button type="submit" class="button button-primary" id="editor-submit">Save</button></div>
    </form>
  </dialog>
  <dialog id="itinerary-share-dialog" class="share-dialog" aria-labelledby="itinerary-share-title">
    <div class="share-shell">
      <div class="share-heading"><div><p class="eyebrow">ITINERARY</p><h2 id="itinerary-share-title">Share as an image</h2></div><button type="button" class="icon-button" id="itinerary-share-close" aria-label="Close image preview">✕</button></div>
      <p class="share-intro">Create a table from your current trip. Review the preview before sending it.</p>
      <div class="share-options"><div class="field"><label for="itinerary-share-style">Table style</label><select id="itinerary-share-style"><option value="detailed" selected>Detailed — activity names and places</option><option value="simple">Simple — activity names only</option></select></div>
        <label class="share-note-option"><input id="itinerary-share-notes" type="checkbox"><span>Include activity notes <small>Optional. Notes may contain private information.</small></span></label></div>
      <p id="itinerary-share-privacy" class="share-privacy">Booking records, costs, tasks and accommodation notes are not used. Check activity titles and places before sharing.</p>
      <div class="share-image-wrap"><p id="itinerary-share-status" class="share-status" role="status">Preparing image…</p><img id="itinerary-share-image" alt="Preview of your generated three-column itinerary table" hidden></div>
      <div class="share-footer"><button type="button" class="button" id="itinerary-share-download" disabled>Download PNG</button><button type="button" class="button button-primary" id="itinerary-share-native" disabled>Share image</button></div>
    </div>
  </dialog>
  <script src="./config.js?v=20260928-8"></script>
  <script type="module" src="./app.js?v=20260928-8"></script>
</body>
</html>
